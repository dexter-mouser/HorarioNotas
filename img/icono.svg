<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Icono de Horario: calendario con marca de hecho">
  <title>Horario</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2330"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <clipPath id="hoja">
      <rect x="100" y="124" width="312" height="292" rx="60"/>
    </clipPath>
  </defs>
  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <!-- Sombra suave bajo la hoja -->
  <rect x="100" y="140" width="312" height="292" rx="60" fill="#000" opacity="0.28"/>
  <!-- Hoja del calendario: cuerpo claro y cabecera coral -->
  <g clip-path="url(#hoja)">
    <rect x="100" y="124" width="312" height="292" fill="#f4f2ee"/>
    <rect x="100" y="124" width="312" height="92" fill="#ff6b4a"/>
  </g>
  <!-- Anillas -->
  <rect x="166" y="84" width="40" height="84" rx="20" fill="#f4f2ee" stroke="#11131a" stroke-width="14"/>
  <rect x="306" y="84" width="40" height="84" rx="20" fill="#f4f2ee" stroke="#11131a" stroke-width="14"/>
  <!-- Marca de hecho -->
  <path d="M188 314l46 46 92-92" fill="none" stroke="#ff6b4a" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
